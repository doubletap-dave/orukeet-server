name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0 or 0.1.0-1)'
        required: true
        type: string

env:
  DH_IMAGE: topiary/orukeet-server
  GHCR_IMAGE: ghcr.io/doubletap-dave/orukeet-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version and tags
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="edge"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Model version strips the -N server-rebuild suffix (0.1.0-1 -> 0.1.0).
          # Used for ORUKEET_MODEL_ID / ORUKEET_HF_FILE build args.
          MODEL_VERSION="${VERSION%%-*}"
          echo "model_version=${MODEL_VERSION}" >> "$GITHUB_OUTPUT"

          # :latest tracks the newest model version only — never -N rebuilds, never edge.
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_LATEST="true"
          else
            IS_LATEST="false"
          fi
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"

          # Model build args: only override the Dockerfile's pinned model on
          # real version builds (tags, manual dispatch). Edge builds (plain
          # pushes to main) must NOT pass them — "orukeet-vedge.nemo" does not
          # exist on HuggingFace and the download 404s, failing the build.
          # Edge builds use the Dockerfile defaults, which track main's pins.
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            BUILD_ARGS="ORUKEET_MODEL_ID=orukeet-v${MODEL_VERSION}
          ORUKEET_HF_FILE=orukeet-v${MODEL_VERSION}.nemo"
          else
            BUILD_ARGS=""
          fi
          {
            echo 'build_args<<EOF'
            echo "${BUILD_ARGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          # Build the tag list for docker/metadata-action.
          TAGS="${{ env.DH_IMAGE }}:${VERSION},${{ env.GHCR_IMAGE }}:${VERSION}"
          if [[ "${IS_LATEST}" == "true" ]]; then
            TAGS="${TAGS},${{ env.DH_IMAGE }}:latest,${{ env.GHCR_IMAGE }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

          echo "version=${VERSION} model_version=${MODEL_VERSION} is_latest=${IS_LATEST}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: ${{ steps.version.outputs.build_args }}
          # ORUKEET_REVISION and ORUKEET_SHA256 intentionally use the Dockerfile
          # defaults — they are pinned per model version in the release commit.
          # If the tag's model version doesn't match the Dockerfile pins, the
          # SHA256 check fails the build rather than shipping a wrong model.
